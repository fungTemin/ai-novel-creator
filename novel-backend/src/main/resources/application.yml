server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/novel_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Shanghai

jwt:
  secret: ${JWT_SECRET:myDefaultSecretKeyForDevelopmentOnlyPleaseChangeInProduction2024}
  expiration: 86400000  # 24 hours in milliseconds

ai:
  default-provider: deepseek
  providers:
    deepseek:
      api-url: https://api.deepseek.com/v1/chat/completions
      api-key: ${DEEPSEEK_API_KEY:your-deepseek-api-key}
      model: deepseek-chat
      max-tokens: 4096
      temperature: 0.8
    xiaomi:
      api-url: ${XIAOMI_API_URL:https://api.xiaomi.com/v1/chat/completions}
      api-key: ${XIAOMI_API_KEY:your-xiaomi-api-key}
      model: ${XIAOMI_MODEL:default}
      max-tokens: 4096
      temperature: 0.8

logging:
  level:
    com.novel: DEBUG
    org.springframework.security: DEBUG
