# ─── 公共配置（提交到 Git，不含敏感信息） ───
# 本地覆盖配置请放 application-local.yml，通过 --spring.profiles.active=local 激活
server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/novel_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Shanghai

  autoconfigure:
    exclude: org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration

jwt:
  secret: ${JWT_SECRET:change-me-in-production}
  expiration: 86400000

ai:
  default-provider: deepseek
  providers:
    deepseek:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}
      model: deepseek-chat
      max-tokens: 4096
      temperature: 0.8
    xiaomi:
      base-url: ${XIAOMI_API_URL:https://api.xiaomi.com/v1}
      api-key: ${XIAOMI_API_KEY:}
      model: ${XIAOMI_MODEL:default}
      max-tokens: 4096
      temperature: 0.8

logging:
  level:
    com.novel: INFO
