services:
  postgres:
    image: postgres:16-alpine
    container_name: novel-postgres
    environment:
      POSTGRES_DB: novel_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - novel_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  novel_pg_data:
